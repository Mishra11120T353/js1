<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOM Day 1</title>
<style>
body {
display: flex;
flex-wrap: wrap;
gap:40px;
}


#btn{
padding: 12px 28px;
font-size: 18px;
font-weight: bold;
background-color:linear-gradient(135deg, #667eea, #764ba2);
border: none;
border-radius:12px;
cursor: pointer;
transition: all 0.3s ease;
box-shadow: 0 8px 20px rgba(0,0,0,0.2);
}


#btn:hover {
transform: translateY(-4px);
}


.scale{
transform: scale(1.08);
transition: 0.3s;
}
        

.animate{
animation: moveText 0.75s ease;
}
        

@keyframes moveText {
0% {
transform: translateX(0); opacity:0;
}
60%{
transform: translateX(50px); opacity: 0.5;
}
100%{
transform: translateX(0); opacity:0;
}


}


</style>
</head>
<body>
<h1 id="heading">wlecome!</h1>
<button id="btn">click me</button>
<h2 id="count"></h2>
</body>
<script src="script.js"></script>
</html>
