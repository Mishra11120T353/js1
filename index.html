<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Day 1</title>
    <style>
        body {
            display: flex;
            flex-wrap: wrap;
            gap:40px;
        }
        #btn{
            display: inline-block;
            margin: 15px 10px;
            padding: 12px 20px;
            color:#eb56a0;
            text-decoration: none;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        #btn:hover{
                   background: #084b94;
                   transform: translateY(-5px) ;
}
        .animate{
            animation: moveText 0.75s ease;
        }
        @keyframes moveText {
            0% {
                transform: translateX(0); opacity:0;
            }
            60%{
                transform: translateX(50px); opacity: 0.5;
            }
            100%{
                transform: translateX(0); opacity:0;
            }
        }
    </style>
</head>
<body>
    <h1 id="heading">wlecome!</h1>
    <button id="btn">click me</button>
</body>
<script src="script.js"></script>
</html>
